name: container-tap-acr

on:
  push:
    tags:
      - "tap-v*-worklyn.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: tap-acr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'codebenderhq/indigo'
    environment: production
    runs-on: ubuntu-latest
    env:
      ACR_NAME: worklynsocialbb1c59
      ACR_REGISTRY: worklynsocialbb1c59.azurecr.io
      UPSTREAM_BASE: 4f47add43060c27e8a37d9d76482ecddf001fcd8
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: release
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^tap-v(0\.1\.10-worklyn\.[1-9][0-9]*)$ ]]
          version="${BASH_REMATCH[1]}"
          commit="$(git rev-parse HEAD)"
          [[ "$commit" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$UPSTREAM_BASE" "$commit"
          [[ "$commit" != "$UPSTREAM_BASE" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'image=%s/tap:%s\n' "$ACR_REGISTRY" "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Re-run candidate-safe Tap gates
        run: |
          go test ./cmd/tap -count=1
          go test -race ./cmd/tap -count=1
          go test ./cmd/tap/... ./util/ssrf ./atproto/identity ./atproto/repo -count=1
          go vet ./cmd/tap/...
      - name: Log in to Azure with workload identity
        uses: Azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Refuse an existing immutable tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if az acr manifest show-metadata --registry "$ACR_NAME" --name "tap:${VERSION}" >/dev/null 2>&1; then
            printf 'refusing to overwrite existing tag: tap:%s\n' "$VERSION" >&2
            exit 1
          fi
      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish candidate-safe Tap
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./cmd/tap/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.release.outputs.image }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/codebenderhq/indigo
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.base.name=https://github.com/bluesky-social/indigo
      - name: Scan immutable image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and source provenance
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          jq -n \
            --arg repository "https://github.com/codebenderhq/indigo" \
            --arg commit "$RELEASE_COMMIT" \
            --arg upstream "https://github.com/bluesky-social/indigo" \
            --arg base "$UPSTREAM_BASE" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            '{buildType:"https://github.com/codebenderhq/indigo/tap-release@v1",
              builder:{id:$workflow},
              invocation:{configSource:{uri:$repository,digest:{sha1:$commit},entryPoint:".github/workflows/container-tap-acr.yml"}},
              materials:[{uri:$repository,digest:{sha1:$commit}},{uri:$upstream,digest:{sha1:$base}}]}' \
            > "$RUNNER_TEMP/tap-source-provenance.json"
          cosign attest --yes --type slsaprovenance \
            --predicate "$RUNNER_TEMP/tap-source-provenance.json" "$IMAGE_REF"
      - name: Verify published evidence
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-tap-acr.yml@${GITHUB_REF}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF"
          attestations="$(cosign verify-attestation --type slsaprovenance \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF")"
          jq -s -e --arg commit "$RELEASE_COMMIT" --arg base "$UPSTREAM_BASE" '
            map(.payload | @base64d | fromjson) as $statements
            | ($statements | length) > 0
            and any($statements[]; any((.predicate.materials // [])[]; .digest.sha1 == $commit))
            and any($statements[]; any((.predicate.materials // [])[]; .digest.sha1 == $base))
          ' <<< "$attestations"
      - name: Freeze tag and subject manifest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          az acr manifest update-metadata --registry "$ACR_NAME" --name "tap:${VERSION}" \
            --write-enabled false --delete-enabled false
          az acr manifest update-metadata --registry "$ACR_NAME" --name "tap@${DIGEST}" \
            --write-enabled false --delete-enabled false
      - name: Record immutable release
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          {
            printf '### Candidate-safe Tap published\n\n'
            printf -- '- Image: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Source: `%s`\n' "$COMMIT"
            printf -- '- Upstream base: `%s`\n' "$UPSTREAM_BASE"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
            printf -- '- Evidence: SBOM, BuildKit max provenance, Trivy critical scan, Cosign signature, source attestation\n'
          } >> "$GITHUB_STEP_SUMMARY"
